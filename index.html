<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            padding: 16px;
        }

        /* экран ввода ФИО */
        .name-screen {
            background: white;
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }
        .name-screen h2 { font-size: 20px; margin-bottom: 8px; }
        .name-screen p { color: gray; font-size: 14px; margin-bottom: 20px; }
        .name-input {
            width: 100%; padding: 14px;
            border: 2px solid #ddd; border-radius: 10px;
            font-size: 16px; margin-bottom: 16px;
            outline: none;
        }
        .name-input:focus { border-color: #1a73e8; }
        .start-btn {
            width: 100%; padding: 14px;
            background: #1a73e8; color: white;
            border: none; border-radius: 10px;
            font-size: 16px; cursor: pointer;
        }
        .start-btn:disabled { background: #ccc; cursor: default; }

        /* тест */
        .question-box {
            background: white; border-radius: 12px;
            padding: 16px; margin-bottom: 16px;
            font-size: 16px; font-weight: bold;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }
        .option {
            display: block; width: 100%;
            background: white; border: 1.5px solid #e0e0e0;
            border-radius: 12px; padding: 14px 16px;
            margin-bottom: 10px; font-size: 14px;
            color: #1a73e8; cursor: pointer; text-align: left;
        }
        .option:hover { border-color: #1a73e8; background: #f0f6ff; }
        .option.correct { border-color: #4caf50; background: #e8f5e9; color: #2e7d32; }
        .option.wrong { border-color: #f44336; background: #ffebee; color: #c62828; }
        .option.disabled { cursor: default; }

        .nav-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 6px; margin-top: 20px;
        }
        .nav-btn {
            aspect-ratio: 1; border: 1.5px solid #ddd;
            border-radius: 8px; background: white;
            font-size: 13px; cursor: pointer; color: #333;
        }
        .nav-btn.active { border-color: #1a73e8; color: #1a73e8; font-weight: bold; }
        .nav-btn.answered { background: #e8f5e9; border-color: #4caf50; }
        .nav-btn.wrong-ans { background: #ffebee; border-color: #f44336; }

        .result {
            display: none; background: white;
            border-radius: 12px; padding: 24px; text-align: center;
        }
        .score-big { font-size: 56px; font-weight: bold; color: #1a73e8; }
        .grade-text { font-size: 22px; margin: 10px 0; }
        .send-btn {
            margin-top: 20px; padding: 14px;
            background: #1a73e8; color: white;
            border: none; border-radius: 10px;
            font-size: 16px; cursor: pointer; width: 100%;
        }
    </style>
</head>
<body>

<!-- Экран ввода ФИО -->
<div id="nameScreen">
    <div class="name-screen">
        <h2>🎓 Testga xush kelibsiz!</h2>
        <p>Boshlash uchun FISHingizni kiriting</p>
        <input
            type="text"
            class="name-input"
            id="nameInput"
            placeholder="Familiya Ism Sharif"
            oninput="checkName()"
        />
        <button class="start-btn" id="startBtn" onclick="startQuiz()" disabled>
            ▶️ Testni boshlash
        </button>
    </div>
</div>

<!-- Тест -->
<div id="quiz" style="display:none;">
    <div class="question-box" id="question"></div>
    <div id="options"></div>
    <div class="nav-grid" id="nav"></div>
</div>

<!-- Результат -->
<div class="result" id="result">
    <div class="score-big" id="score"></div>
    <div class="grade-text" id="grade"></div>
    <p id="details" style="color:gray; margin-top:8px;"></p>
    <p id="studentName" style="margin-top:8px; font-weight:bold;"></p>
    <button class="send-btn" onclick="sendResult()">✅ Natijani yuborish</button>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

let studentName = "";

// ===== ВОПРОСЫ =====
const questions = [
    {
        question: "Zarb mexanizmlari turlarini ayting?",
        options: [
            "Yuqoridan uruvchi, haydagich zarb qutisi ustida gorizontal joylashgan",
            "Pastdan uruvchi, yurituvchi bo'g'in uning past qismiga ta'sir qiladi",
            "Pastki qismdan uruvchi, haydagich vertikal tekislikda joylashgan",
            "Oldingi qismidan uruvchi, yurituvchi bo'g'in uning o'rta qismiga ta'sir qiladi"
        ],
        answer: 0
    },
    {
        question: "Mashinasozlikda qaysi material eng ko'p ishlatiladi?",
        options: ["Yog'och", "Plastik", "Po'lat", "Mis"],
        answer: 2
    },
    {
        question: "Mexanik harakat nima?",
        options: [
            "Jismning fazodagi o'rni o'zgarishi",
            "Jismning massasi o'zgarishi",
            "Jismning harorati o'zgarishi",
            "Jismning rangi o'zgarishi"
        ],
        answer: 0
    }
];

let current = 0;
let userAnswers = new Array(questions.length).fill(null);

function checkName() {
    const val = document.getElementById("nameInput").value.trim();
    document.getElementById("startBtn").disabled = val.length < 3;
}

function startQuiz() {
    studentName = document.getElementById("nameInput").value.trim();
    document.getElementById("nameScreen").style.display = "none";
    document.getElementById("quiz").style.display = "block";
    showQuestion();
}

function renderNav() {
    const nav = document.getElementById("nav");
    nav.innerHTML = "";
    questions.forEach((_, i) => {
        const btn = document.createElement("button");
        btn.className = "nav-btn";
        btn.textContent = i + 1;
        if (i === current) btn.classList.add("active");
        if (userAnswers[i] !== null) {
            btn.classList.add(userAnswers[i] === questions[i].answer ? "answered" : "wrong-ans");
        }
        btn.onclick = () => { current = i; showQuestion(); };
        nav.appendChild(btn);
    });
}

function showQuestion() {
    const q = questions[current];
    document.getElementById("question").textContent = `${current + 1}. ${q.question}`;

    const optionsDiv = document.getElementById("options");
    optionsDiv.innerHTML = "";

    q.options.forEach((opt, i) => {
        const btn = document.createElement("button");
        btn.className = "option";
        btn.textContent = opt;
        if (userAnswers[current] !== null) {
            btn.classList.add("disabled");
            btn.disabled = true;
            if (i === q.answer) btn.classList.add("correct");
            else if (i === userAnswers[current]) btn.classList.add("wrong");
        } else {
            btn.onclick = () => selectAnswer(i);
        }
        optionsDiv.appendChild(btn);
    });

    renderNav();
}

function selectAnswer(idx) {
    const q = questions[current];
    userAnswers[current] = idx;

    const buttons = document.querySelectorAll(".option");
    buttons.forEach((btn, i) => {
        btn.disabled = true;
        btn.classList.add("disabled");
        if (i === q.answer) btn.classList.add("correct");
        else if (i === idx) btn.classList.add("wrong");
    });

    renderNav();

    setTimeout(() => {
        if (current < questions.length - 1) {
            current++;
            showQuestion();
        } else if (userAnswers.every(a => a !== null)) {
            showResult();
        }
    }, 800);
}

function showResult() {
    document.getElementById("quiz").style.display = "none";
    const resultDiv = document.getElementById("result");
    resultDiv.style.display = "block";

    const correct = userAnswers.filter((a, i) => a === questions[i].answer).length;
    const total = questions.length;
    const pct = Math.round((correct / total) * 100);

    let grade = "";
    if (pct >= 90) grade = "Baho: 5 ⭐";
    else if (pct >= 70) grade = "Baho: 4 ✅";
    else if (pct >= 50) grade = "Baho: 3 ⚠️";
    else grade = "Baho: 2 ❌";

    document.getElementById("score").textContent = `${correct}/${total}`;
    document.getElementById("grade").textContent = grade;
    document.getElementById("details").textContent = `To'g'ri javoblar: ${pct}%`;
    document.getElementById("studentName").textContent = `👤 ${studentName}`;
}

function sendResult() {
    const correct = userAnswers.filter((a, i) => a === questions[i].answer).length;
    const total = questions.length;
    const pct = Math.round((correct / total) * 100);
    tg.sendData(JSON.stringify({
        correct, total, percent: pct,
        name: studentName
    }));
}

showQuestion();
</script>
</body>
</html>
